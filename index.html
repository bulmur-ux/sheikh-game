<title>شيك شيك | لعبة المجلس أونلاين</title>
<style>
:root{--bg:#f3ead8;--card:#fffaf0;--ink:#281d17;--muted:#817268;--maroon:#6d2633;--gold:#d0a13b;--line:#dfcfb3;--green:#2f6558;--danger:#a33d36;--blue:#1f6fb2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f5ecd9,#eee1c7);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh}
.wrap{width:min(100%,600px);margin:auto;padding:0 14px 34px}.stripe{height:10px;background:repeating-linear-gradient(135deg,var(--maroon) 0 8px,var(--gold) 8px 16px);border-radius:0 0 10px 10px}
header{text-align:center;padding:22px 0 10px}header h1{margin:0;color:var(--maroon);font-size:34px}header p{margin:5px 0;color:var(--muted)}
.panel{background:rgba(255,250,240,.96);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 3px 12px rgba(40,29,23,.06)}
label{font-weight:800;font-size:14px;display:block;margin:0 0 7px}input,select{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-size:16px;text-align:right;outline:none}input:focus,select:focus{border-color:var(--gold)}
button{border:0;border-radius:13px;padding:13px 14px;font:inherit;font-weight:800;cursor:pointer}.btn{width:100%;background:var(--gold);color:#201912}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.danger{background:var(--danger);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}.row>*{flex:1}.gap{height:8px}.err{color:var(--danger);font-size:13px;margin-top:8px}.ok{color:var(--green);font-size:13px;margin-top:8px}.center{text-align:center}
.code{font-size:32px;letter-spacing:6px;font-weight:900;text-align:center;padding:14px;border:2px dashed var(--gold);border-radius:14px;background:#fff;margin:10px 0}.players{list-style:none;padding:0;margin:10px 0}.players li{padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:7px 0;display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:var(--muted);line-height:1.7}.badge{display:inline-block;padding:3px 8px;border-radius:20px;background:#ead7a7;font-size:11px;margin-inline-start:6px}.turnBadge{background:#d9efe6;color:#1f5b4b}
.chat{height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.chat p{margin:0 0 8px;font-size:14px}.chat b{color:var(--maroon)}.quick{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.quick button{white-space:nowrap;background:#efe2c8;padding:9px 11px}.hidden{display:none}.status{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}

.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.slot{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center;min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.slot.empty{opacity:.4}.slot.selected{outline:3px solid var(--gold)}.slot .cardFace,.slot .cardBack{width:70px;height:98px}.slot button{padding:8px 10px;width:100%;font-size:13px}
.notice{padding:11px 12px;border-radius:12px;background:#fff7df;border:1px solid #ead7a7;margin:10px 0;font-size:13px;line-height:1.7}.notice.good{background:#eaf6f1;border-color:#b9dfcf}.notice.bad{background:#fff0ef;border-color:#edc1bd}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(30,22,18,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:30}.modal.hidden{display:none}.sheet{width:min(100%,580px);max-height:85vh;overflow:auto;background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line)}.sheet h3{margin:0 0 12px}.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.playerPick{padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:7px 0}.scoreTable{width:100%;border-collapse:collapse}.scoreTable td,.scoreTable th{padding:10px;border-bottom:1px solid var(--line);text-align:right}.winner{font-size:24px;color:var(--maroon);font-weight:900;text-align:center;padding:10px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#211b17;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;z-index:50;display:none}.voiceBar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.voiceBar button{flex:1;min-width:120px}.voiceState{font-size:12px;color:var(--muted);width:100%;text-align:center}.voiceDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-inline-end:5px}.voiceDot.on{background:#2f9e64}.voiceDot.warn{background:#d79b2b}

/* ===== شيك شيك — واجهة الطاولة الإماراتية ===== */
body{background:radial-gradient(circle at 50% -10%,#5a2b1c 0,#24150f 38%,#100b09 100%);color:#f8ecd0}
.wrap{width:min(100%,980px);padding:0 10px 28px}
.stripe{height:6px;background:linear-gradient(90deg,#8b1e2d,#d8a83d,#8b1e2d)}
header{padding:12px 0 8px}header h1{color:#f4d88a;font-size:36px;text-shadow:0 2px 9px #000}header p{color:#d6c19d}
.panel{background:rgba(27,18,14,.94);border:1px solid rgba(220,171,69,.55);color:#fff3d6;box-shadow:0 10px 30px rgba(0,0,0,.28)}

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getDatabase(fb),app=document.getElementById("app"),modal=document.getElementById("modal"),sheet=document.getElementById("sheet");

function cleanupSubs(){for(const f of [unsubRoom,unsubChat,unsubHand])if(f)try{f()}catch{}unsubRoom=unsubChat=unsubHand=null;stopLiveVoice(false)}
async function createRoom(){const n=document.getElementById("name").value.trim();if(!n){document.getElementById("err").textContent="اكتب اسم اللاعب أولاً";return}try{await ensureAuth();uid=auth.currentUser.uid;let c=randomCode();for(let i=0;i<5;i++){const s=await get(ref(db,`rooms/${c}/public`));if(!s.exists())break;c=randomCode()}await set(ref(db,`rooms/${c}/public`),{hostId:uid,status:"lobby",createdAt:Date.now(),players:{[uid]:{name:n,order:0,cardCount:0,ready:false}}});myName=n;roomCode=c;localStorage.setItem("sheikh_name",n);localStorage.setItem("sheikh_room",c);subscribe(c)}catch(e){document.getElementById("err").textContent="تعذر إنشاء الغرفة: "+(e?.code||e?.message||"خطأ")}}
async function joinRoom(){const n=document.getElementById("name").value.trim(),c=document.getElementById("code").value.trim().toUpperCase();if(!n||!c){document.getElementById("err").textContent="اكتب الاسم وكود الغرفة";return}try{await ensureAuth();uid=auth.currentUser.uid;const s=await get(ref(db,`rooms/${c}/public`));if(!s.exists())throw new Error("الغرفة غير موجودة");const r=s.val(),ps=r.players||{};if(r.status!=="lobby"&&!ps[uid])throw new Error("اللعبة بدأت");if(Object.keys(ps).length>=8&&!ps[uid])throw new Error("الغرفة مكتملة");const order=ps[uid]?.order??Object.keys(ps).length;await update(ref(db,`rooms/${c}/public/players/${uid}`),{name:n,order,cardCount:ps[uid]?.cardCount||0,ready:ps[uid]?.ready||false});myName=n;roomCode=c;localStorage.setItem("sheikh_name",n);localStorage.setItem("sheikh_room",c);subscribe(c)}catch(e){document.getElementById("err").textContent=e?.message||"تعذر دخول الغرفة"}}
function subscribe(c){cleanupSubs();unsubRoom=onValue(ref(db,`rooms/${c}/public`),async s=>{if(!s.exists()){home("الغرفة غير موجودة");return}currentRoom=s.val();await autoGameWork();render();if(voiceActive)syncVoicePeers();},e=>home("فشل قراءة الغرفة: "+(e.code||e.message)));unsubChat=onValue(query(ref(db,`rooms/${c}/chat`),limitToLast(60)),s=>{latestChat=s.val()||{};renderChat()});unsubHand=onValue(ref(db,`rooms/${c}/privateHands/${uid}`),async s=>{myHand=s.exists()?s.val():null;await autoGameWork();render()})}

async function startGame(){if(uid!==currentRoom?.hostId)return;const order=[...document.querySelectorAll('[data-active]:checked')].map(x=>x.dataset.active),totalRounds=Math.max(1,Math.min(10,Number(document.getElementById("roundCount")?.value||3)));if(order.length<2||order.length>4){toast("اختر من 2 إلى 4 لاعبين");return}const totals={};for(const id of order)totals[id]=0;await beginRound(order,1,totalRounds,totals)}
async function beginRound(order,roundNo,totalRounds,totals){totals={...(totals||{})};for(const id of order)if(totals[id]==null)totals[id]=0;const deck=buildDeck(),discard=deck.shift(),players={};for(const [id,p] of playerEntries())players[id]={...p,role:order.includes(id)?"player":"spectator",cardCount:0,ready:!order.includes(id)};await set(ref(db,`rooms/${roomCode}/public/game`),{phase:"dealing",turnOrder:order,turnIndex:0,deck,discard,discardSeq:1,startedAt:Date.now(),actionSeq:0,ending:false,finalRemaining:{},checkCalledBy:"",roundNo,totalRounds,cumulativeScores:totals||{},emptyWinner:"",swapRequest:null,jackSwap:null});await update(ref(db,`rooms/${roomCode}/public`),{status:"game",players,reveals:null});try{await remove(ref(db,`rooms/${roomCode}/privateHands/${uid}`))}catch{}toast(`بدأت الجولة ${roundNo} من ${totalRounds}`)}
async function autoGameWork(){if(!currentRoom||!uid)return;const g=game();if(currentRoom.status==="lobby"&&myHand){await remove(ref(db,`rooms/${roomCode}/privateHands/${uid}`));myHand=null;return}if(currentRoom.status==="game"&&g.phase==="dealing"){
 if(!isActivePlayer()&&myHand){await remove(ref(db,`rooms/${roomCode}/privateHands/${uid}`));myHand=null;return}
 if(isActivePlayer()&&myHand&&Number(myHand.roundNo||0)!==Number(g.roundNo||1)){await remove(ref(db,`rooms/${roomCode}/privateHands/${uid}`));myHand=null;return}
 if(isActivePlayer()&&!myHand)await claimInitialHand();
}if(g.phase==="dealing"&&uid===currentRoom.hostId){const ps=activePlayerEntries();if(ps.length&&ps.every(([id,p])=>p.ready&&p.cardCount===4)){await update(ref(db,`rooms/${roomCode}/public/game`),{phase:"playing",turnIndex:0});await sendSystem("بدأت اللعبة");}}
 if(g.swapRequest)await processSwapRequest(g.swapRequest);
 if(g.jackSwap)await processJackSwap(g.jackSwap);
 if(g.phase==="reveal"&&isActivePlayer()&&myHand&&!currentRoom.reveals?.[uid]){
 const cards=myHand.cards||[];
 await set(ref(db,`rooms/${roomCode}/public/reveals/${uid}`),{name:myName,cards,score:cards.filter(Boolean).reduce((s,c)=>s+scoreCard(c),0),submittedAt:Date.now()});
}
}
async function claimInitialHand(){
 let claimed=null;
 const tx=await runTransaction(ref(db,`rooms/${roomCode}/public/game`),g=>{if(!g||g.phase!=="dealing")return g;if(g.dealt&&g.dealt[uid])return g;const d=Array.isArray(g.deck)?g.deck.slice():[];if(d.length<4)return g;claimed=d.splice(0,4);g.deck=d;g.dealt=g.dealt||{};g.dealt[uid]=true;return g});
 if(tx.committed&&claimed){await set(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{cards:claimed,pending:null,pendingSource:null,powerCards:null,lastKabasSeq:0,roundNo:Number(game().roundNo||1)});await update(ref(db,`rooms/${roomCode}/public/players/${uid}`),{cardCount:4,ready:true});localRevealUntil={0:Date.now()+10000,1:Date.now()+10000};setTimeout(render,10200)}
}

async function drawCard(){sfx("draw");if(!isMyTurn()||myHand?.pending){toast("مو دور السحب الحين");return}let drawn=null;const tx=await runTransaction(ref(db,`rooms/${roomCode}/public/game/deck`),d=>{if(!Array.isArray(d)||!d.length)return d;d=d.slice();drawn=d.shift();return d});if(!tx.committed||!drawn){toast("الرزمة خلصت");return}await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:drawn,pendingSource:"deck"});await update(ref(db,`rooms/${roomCode}/public/game`),{hasDrawn:uid});}
async function takeFieldCard(){sfx("take");if(!isMyTurn()||myHand?.pending)return;const d=game().discard;if(!d){toast("ما في كرت في الميدان");return}await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:d,pendingSource:"field"});await update(ref(db,`rooms/${roomCode}/public/game`),{discard:null,hasDrawn:uid,lastAction:`${myName} أخذ كرت الميدان`});}
async function swapPendingWithSlot(i){sfx("swap");if(!isMyTurn()||!myHand?.pending)return;const cards=(myHand.cards||[]).slice(),old=cards[i];if(!old){toast("الخانة فاضية");return}cards[i]=myHand.pending;await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cards);await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:null,pendingSource:null});await discardAndFinish(old,"بدّل ورقة")}
async function throwPending(){sfx("throw");if(!isMyTurn()||!myHand?.pending)return;const c=myHand.pending,src=myHand.pendingSource||"deck";await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:null,pendingSource:null});await putDiscard(c,`${myName} رمى ${cardLabel(c)}`);if(src!=="deck")return finishTurn();if(c.r==="JOKER"&&c.color==="color"){sfx("joker2");return chooseClear(2,"الجوكر الملون: امسح ورقتين")}if(c.r==="JOKER"&&c.color==="black"){sfx("joker1");return chooseClear(1,"الجوكر الأسود: امسح ورقة")}await finishTurn()}
async function useRedQ(){sfx("queen");if(!isMyTurn()||!myHand?.pending||myHand.pendingSource!=="deck"||myHand.pending.r!=="Q"||!isRed(myHand.pending))return;const c=myHand.pending;await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:null,pendingSource:null});await putDiscard(c,`${myName} استخدم Q الأحمر`);choosePeek()}
async function useRedK(){sfx("king");if(!isMyTurn()||!myHand?.pending||myHand.pendingSource!=="deck"||myHand.pending.r!=="K"||!isRed(myHand.pending))return;const k=myHand.pending;await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:null,pendingSource:null});await putDiscard(k,`${myName} استخدم K الأحمر`);await kingPower()}
async function playFromHand(){if(!isMyTurn()||myHand?.pending)return;const cards=myHand?.cards||[];const d=game().discard;if(!d){toast("ما في كرت في الميدان");return}openModal(`<h3>ارمِ من أوراقك</h3><div class="notice">اختر الورقة اللي تعتقد أنها نفس رقم/رتبة كرت الميدان. إذا غلط، تاخذ ورقة زيادة.</div><div class="choiceGrid">${cards.map((c,i)=>c?`<button class="btn alt" data-playhand="${i}">الورقة ${i+1}</button>`:`<button disabled>فارغة</button>`).join("")}</div>`);sheet.querySelectorAll("[data-playhand]").forEach(b=>b.onclick=()=>tryPlayHand(+b.dataset.playhand))}
async function tryPlayHand(i){closeModal();const cards=(myHand?.cards||[]).slice(),c=cards[i],d=game().discard;if(!c||!d)return;if(sameRank(c,d)){cards[i]=null;await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cards);await update(ref(db,`rooms/${roomCode}/public/players/${uid}`),{cardCount:countCards(cards)});await putDiscard(c,`${myName} رمى ورقة صحيحة من أوراقه`);sfx("correct");toast("صح ✅");if(await checkEmptyAndEnd(cards))return;await finishTurn();return}let penalty=null;const tx=await runTransaction(ref(db,`rooms/${roomCode}/public/game/deck`),deck=>{if(!Array.isArray(deck)||!deck.length)return deck;deck=deck.slice();penalty=deck.shift();return deck});if(penalty){cards.push(penalty);await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cards);await update(ref(db,`rooms/${roomCode}/public/players/${uid}`),{cardCount:countCards(cards)});sfx("wrong");setTimeout(()=>sfx("penalty"),180);toast(`غلط ❌ صار عندك ${countCards(cards)} أوراق`);await sendSystem(`${myName} اختار ورقة غلط وأخذ ورقة زيادة`)}else toast("غلط، والرزمة خلصت");await finishTurn()}
async function putDiscard(card,log){const seq=(game().discardSeq||0)+1;await update(ref(db,`rooms/${roomCode}/public/game`),{discard:card,discardSeq:seq,lastAction:log,hasDrawn:null,actionSeq:(game().actionSeq||0)+1})}
async function checkEmptyAndEnd(cards){if(countCards(cards)!==0)return false;await update(ref(db,`rooms/${roomCode}/public/game`),{phase:"reveal",emptyWinner:uid,ending:true,hasDrawn:null,lastAction:`${myName} خلص أوراقه — انتهت الجولة`});await sendSystem(`${myName} خلص أوراقه! نتيجته 0 وانتهت الجولة`);sfx("win");return true}
async function discardAndFinish(card,log){await putDiscard(card,log);await finishTurn()}

function chooseClear(n,title){const cards=myHand?.cards||[];openModal(`<h3>${title}</h3><div class="notice">اختر ${n} ${n===1?'ورقة':'ورقتين'} من أوراقك للمسح.</div><div class="choiceGrid">${cards.map((c,i)=>c?`<button class="btn alt" data-clear="${i}">الورقة ${i+1}</button>`:`<button disabled>فارغة</button>`).join("")}</div><div class="gap"></div><button id="cancelPower" class="btn danger">إلغاء القوة وإنهاء الدور</button>`);let chosen=[];sheet.querySelectorAll("[data-clear]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.clear;if(chosen.includes(i))return;chosen.push(i);b.disabled=true;b.textContent="تم الاختيار";if(chosen.length>=n){const cs=(myHand.cards||[]).slice();for(const k of chosen)cs[k]=null;await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cs);await update(ref(db,`rooms/${roomCode}/public/players/${uid}`),{cardCount:countCards(cs)});closeModal();await sendSystem(`${myName} استخدم قوة الجوكر`);if(await checkEmptyAndEnd(cs))return;await finishTurn()}});document.getElementById("cancelPower").onclick=async()=>{closeModal();await finishTurn()}}
function choosePeek(){const cards=myHand?.cards||[];openModal(`<h3>قوة البنت Q</h3><div class="notice">اختر ورقة من أوراقك لتشوفها 10 ثواني.</div><div class="choiceGrid">${cards.map((c,i)=>c?`<button class="btn alt" data-peek="${i}">الورقة ${i+1}</button>`:`<button disabled>فارغة</button>`).join("")}</div>`);sheet.querySelectorAll("[data-peek]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.peek;localRevealUntil[i]=Date.now()+10000;closeModal();render();setTimeout(render,10200);await sendSystem(`${myName} استخدم قوة البنت`);await finishTurn()})}
async function kingPower(){let picked=[];const tx=await runTransaction(ref(db,`rooms/${roomCode}/public/game/deck`),d=>{if(!Array.isArray(d)||d.length<2)return d;d=d.slice();picked=d.splice(0,2);return d});if(!tx.committed||picked.length<2){toast("ما في ورقتين كفاية");return finishTurn()}await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{powerCards:picked});showKingChoices(picked)}
function showKingChoices(cards){openModal(`<h3>قوة K الأحمر</h3><div class="notice">سحبت كرتين. اختر الكرت اللي تبيه، والكرت الثاني ينرمي فوق في الميدان.</div><div class="choiceGrid">${cards.map((c,i)=>`<button class="btn alt" data-kpick="${i}"><div class="cardFace ${cardClass(c)}" style="margin:auto">${cardLabel(c)}</div></button>`).join("")}</div>`);sheet.querySelectorAll("[data-kpick]").forEach(b=>b.onclick=()=>chooseKingSlot(+b.dataset.kpick,cards))}
async function chooseKingSlot(chosen,cards){const keep=cards[chosen],other=cards[chosen?0:1];await putDiscard(other,`${myName} رمى الكرت الثاني من قوة K`);await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:keep,pendingSource:"king",powerCards:null});closeModal();toast("اختر ورقة من أوراقك للتبديل")}
async function useJackPower(){sfx("jack");
 if(!isMyTurn()||myHand?.pending?.r!=="J"||myHand?.pendingSource!=="deck")return;
 const c=myHand.pending;
 await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{pending:null,pendingSource:null});
 await putDiscard(c,`${myName} استخدم الولد J`);
 chooseJack();
}
function chooseJack(){
 const ps=playerEntries().filter(([id,p])=>(p.cardCount??0)>0);
 if(ps.length<2){toast("ما في لاعبين كفاية للتبديل");return finishTurn()}
 openModal(`<h3>قوة الولد J</h3><div class="notice good">اختر <b>الورقة الأولى</b>. تقدر تختار من أوراقك أو من أي لاعب.</div>${ps.map(([id,p])=>`<button class="playerPick btn alt" data-jp1="${id}">${esc(p.name)}${id===uid?' (أنت)':''}</button>`).join("")}`);
 sheet.querySelectorAll("[data-jp1]").forEach(b=>b.onclick=()=>chooseJackSlot1(b.dataset.jp1,ps));
}
function jackSlotsFor(playerUid,attr){
 const n=Math.max(1,currentRoom.players?.[playerUid]?.cardCount||4);
 return Array.from({length:n},(_,i)=>`<button class="btn alt" ${attr}="${i}">الورقة ${i+1}</button>`).join("");
}

function chooseJackSlot2(first,secondUid){
 const name=currentRoom.players?.[secondUid]?.name||"اللاعب";
 openModal(`<h3>${esc(name)}</h3><div class="notice">اختر الورقة الثانية للتبديل.</div><div class="choiceGrid">${jackSlotsFor(secondUid,"data-js2")}</div>`);

   const req={id:uid+"_J_"+Date.now(),initiatorUid:uid,initiatorName:myName,aUid:first.uid,aIndex:first.index,bUid:second.uid,bIndex:second.index,status:"collecting",parts:{},aDone:false,bDone:false,ts:Date.now()};
   await set(ref(db,`rooms/${roomCode}/public/game/jackSwap`),req);

 })

async function processJackSwap(req){
 if(!req||processingJack||!myHand)return;
 processingJack=true;
 try{
   const isA=req.aUid===uid,isB=req.bUid===uid;
   if(req.status==="collecting"){
     const patch={};
     if(isA&&!req.parts?.A){const c=myHand.cards?.[req.aIndex];if(c)patch["parts/A"]=c;else patch.failed="الورقة الأولى غير موجودة"}
     if(isB&&!req.parts?.B){const c=myHand.cards?.[req.bIndex];if(c)patch["parts/B"]=c;else patch.failed="الورقة الثانية غير موجودة"}
     if(Object.keys(patch).length){await update(ref(db,`rooms/${roomCode}/public/game/jackSwap`),patch);return}
   }
   if(req.failed){if(req.initiatorUid===uid){toast(req.failed);await set(ref(db,`rooms/${roomCode}/public/game/jackSwap`),null);await finishTurn()}return}
   if(req.parts?.A&&req.parts?.B){
     if(req.aUid===req.bUid&&uid===req.aUid&&!req.aDone&&!req.bDone){
       const cs=(myHand.cards||[]).slice(),a=cs[req.aIndex],b=cs[req.bIndex];
       if(!a||!b){await update(ref(db,`rooms/${roomCode}/public/game/jackSwap`),{failed:"إحدى الورقتين غير موجودة"});return}
       cs[req.aIndex]=b;cs[req.bIndex]=a;
       await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cs);
       await update(ref(db,`rooms/${roomCode}/public/game/jackSwap`),{aDone:true,bDone:true});return
     }
     if(isA&&!req.aDone){const cs=(myHand.cards||[]).slice();if(!cs[req.aIndex]){await update(ref(db,`rooms/${roomCode}/public/game/jackSwap`),{failed:"الورقة الأولى غير موجودة"});return}cs[req.aIndex]=req.parts.B;await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cs);await update(ref(db,`rooms/${roomCode}/public/game/jackSwap`),{aDone:true});return}
     if(isB&&!req.bDone){const cs=(myHand.cards||[]).slice();if(!cs[req.bIndex]){await update(ref(db,`rooms/${roomCode}/public/game/jackSwap`),{failed:"الورقة الثانية غير موجودة"});return}cs[req.bIndex]=req.parts.A;await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cs);await update(ref(db,`rooms/${roomCode}/public/game/jackSwap`),{bDone:true});return}
     if(req.initiatorUid===uid&&req.aDone&&req.bDone){await set(ref(db,`rooms/${roomCode}/public/game/jackSwap`),null);await sendSystem(`${myName} بدّل ورقتين بقوة الولد J`);await finishTurn()}
   }
 }finally{processingJack=false}
}
async function processSwapRequest(req){if(!req||processingSwap)return;processingSwap=true;try{if(req.status==="pending"&&req.toUid===uid&&myHand){if(myHand.lastSwapId===req.id)return;const cs=(myHand.cards||[]).slice(),old=cs[req.targetIndex];if(!old){await update(ref(db,`rooms/${roomCode}/public/game/swapRequest`),{status:"failed",reason:"الخانة فارغة"});return}cs[req.targetIndex]=req.offered;await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{cards:cs,lastSwapId:req.id});await update(ref(db,`rooms/${roomCode}/public/game/swapRequest`),{status:"returned",returned:old});}
 if(req.status==="returned"&&req.fromUid===uid&&myHand){const cs=(myHand.cards||[]).slice();cs[req.myIndex]=req.returned;await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cs);await set(ref(db,`rooms/${roomCode}/public/game/swapRequest`),null);await sendSystem(`${myName} استخدم قوة الولد`);await finishTurn()}
 if(req.status==="failed"&&req.fromUid===uid){toast(req.reason||"فشل التبديل");await set(ref(db,`rooms/${roomCode}/public/game/swapRequest`),null);await finishTurn()}}finally{processingSwap=false}}

async function kabas(i){const c=myHand?.cards?.[i],d=game().discard,seq=game().discardSeq||0;if(!c||!d)return;if(myHand.lastKabasSeq===seq){toast("كبست على هالرميه قبل");return}if(!sameRank(c,d)){toast("مو نفس الورقة");await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{lastKabasSeq:seq});return}const cs=(myHand.cards||[]).slice();cs[i]=null;await set(ref(db,`rooms/${roomCode}/privateHands/${uid}/cards`),cs);await update(ref(db,`rooms/${roomCode}/privateHands/${uid}`),{lastKabasSeq:seq});await update(ref(db,`rooms/${roomCode}/public/players/${uid}`),{cardCount:countCards(cs)});await sendSystem(`${myName} كبس ${cardLabel(c)} ⚡`);toast("كبسة صحيحة ⚡")}
async function callCheck(){sfx("check");if(!isMyTurn())return;const order=game().turnOrder||[],remaining={};for(const id of order)if(id!==uid)remaining[id]=true;await update(ref(db,`rooms/${roomCode}/public/game`),{ending:true,checkCalledBy:uid,finalRemaining:remaining});await sendSystem(`${myName} قال شيك`);await finishTurn(true)}
async function finishTurn(fromCheck=false){const g=game(),order=g.turnOrder||[];if(!order.length)return;let remaining={...(g.finalRemaining||{})};if(g.ending&&!fromCheck&&remaining[uid]){delete remaining[uid];await set(ref(db,`rooms/${roomCode}/public/game/finalRemaining`),remaining)}if(g.ending&&Object.keys(remaining).length===0){await update(ref(db,`rooms/${roomCode}/public/game`),{phase:"reveal",hasDrawn:null});return}
 let idx=(g.turnIndex||0),tries=0;do{idx=(idx+1)%order.length;tries++}while((currentRoom.players?.[order[idx]]?.cardCount??0)<=0&&tries<order.length);await update(ref(db,`rooms/${roomCode}/public/game`),{turnIndex:idx,hasDrawn:null});}
async function maybeFinishReveal(){if(game().phase!=="reveal")return;const g=game(),order=g.turnOrder||[],rev=currentRoom.reveals||{};if(order.length&&order.every(id=>rev[id]&&Array.isArray(rev[id].cards))){const scores={},totals={...(g.cumulativeScores||{})};for(const id of order){const cards=rev[id]?.cards||[],roundScore=id===g.emptyWinner?0:cards.filter(Boolean).reduce((s,c)=>s+scoreCard(c),0);scores[id]={name:currentRoom.players?.[id]?.name||rev[id]?.name||"لاعب",score:roundScore,cards};totals[id]=(Number(totals[id])||0)+roundScore}await update(ref(db,`rooms/${roomCode}/public/game`),{results:scores,cumulativeScores:totals,phase:"finished",finishedAt:Date.now()});sfx("reveal")}}

function renderHandSlots(){const cards=myHand?.cards||[null,null,null,null],pending=!!myHand?.pending;const n=Math.max(4,cards.length);return Array.from({length:n},(_,i)=>{const c=cards[i];if(!c)return `<div class="slot empty"><div class="cardBack">فارغة</div></div>`;const reveal=(localRevealUntil[i]||0)>Date.now();return `<div class="slot">${reveal?`<div class="cardFace ${cardClass(c)}">${cardLabel(c)}</div>`:`<div class="cardBack" aria-label="ورقة مخفية"></div>`}${pending&&isMyTurn()?`<button class="btn alt" data-swap="${i}">بدّل بهذي</button>`:""}</div>`}).join("")}

async function resetToLobby(){if(uid!==currentRoom.hostId)return;for(const [id] of playerEntries())if(id===uid)await remove(ref(db,`rooms/${roomCode}/privateHands/${id}`));const players={};for(const [id,p] of playerEntries())players[id]={name:p.name,order:p.order,cardCount:0,ready:false};await set(ref(db,`rooms/${roomCode}/public`),{hostId:currentRoom.hostId,status:"lobby",createdAt:Date.now(),players});await remove(ref(db,`rooms/${roomCode}/public/reveals`))}

async function startLiveVoice(){
 if(voiceActive){toast("المايك شغال بالفعل");return}
 try{
   if(!navigator.mediaDevices?.getUserMedia)throw new Error("المتصفح لا يدعم المايك");
   localVoiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
   voiceActive=true;voiceMuted=false;updateVoiceUi();
   await update(ref(db,`rooms/${roomCode}/public/voiceUsers/${uid}`),{name:myName,active:true,muted:false,ts:Date.now()});
   await syncVoicePeers();toast("تم تشغيل المايك المباشر 🎙️")
 }catch(e){voiceActive=false;localVoiceStream=null;updateVoiceUi();toast(e?.name==="NotAllowedError"?"اسمح للمتصفح باستخدام المايك":"تعذر تشغيل المايك: "+(e?.message||"خطأ"))}
}
async function toggleVoiceMute(){if(!voiceActive||!localVoiceStream)return;voiceMuted=!voiceMuted;for(const t of localVoiceStream.getAudioTracks())t.enabled=!voiceMuted;try{await update(ref(db,`rooms/${roomCode}/public/voiceUsers/${uid}`),{muted:voiceMuted,active:true,ts:Date.now()})}catch{}updateVoiceUi();toast(voiceMuted?"تم كتم المايك":"تم فتح المايك")}

 if(was&&removeState)toast("تم إيقاف الصوت المباشر")
}
function attachRemoteAudio(otherUid,stream){const box=document.getElementById("voiceAudios");let a=document.getElementById("voice_"+otherUid);if(!a){a=document.createElement("audio");a.id="voice_"+otherUid;a.autoplay=true;a.playsInline=true;box.appendChild(a)}a.srcObject=stream;const p=a.play();if(p?.catch)p.catch(()=>{})}
async function makePeer(otherUid){
 if(voicePeers.has(otherUid)||!localVoiceStream)return voicePeers.get(otherUid);
 const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});voicePeers.set(otherUid,pc);
 for(const t of localVoiceStream.getTracks())pc.addTrack(t,localVoiceStream);
 pc.ontrack=e=>{const st=e.streams?.[0]||new MediaStream([e.track]);attachRemoteAudio(otherUid,st)};
 pc.onconnectionstatechange=()=>{updateVoiceUi();if(["failed","closed"].includes(pc.connectionState)){try{pc.close()}catch{}voicePeers.delete(otherUid)}};
 return pc
}
async function syncVoicePeers(){
 if(!voiceActive||!localVoiceStream||!currentRoom||voiceSyncBusy)return;voiceSyncBusy=true;
 try{
   const players=Object.keys(currentRoom.players||{}).filter(id=>id!==uid);
   for(const otherUid of players){
     let pc=await makePeer(otherUid);if(!pc)continue;
     const pair=pairIdFor(uid,otherUid),sig=currentRoom.voiceSignals?.[pair]||{},initiator=uid<otherUid;
     if(initiator){
       if(!sig.offer&&pc.signalingState==="stable"){
         const offer=await pc.createOffer({offerToReceiveAudio:true});await pc.setLocalDescription(offer);await waitIceComplete(pc);
         await set(ref(db,`rooms/${roomCode}/public/voiceSignals/${pair}/offer`),{type:pc.localDescription.type,sdp:pc.localDescription.sdp,from:uid,ts:Date.now()});
       }
       const latest=(await get(ref(db,`rooms/${roomCode}/public/voiceSignals/${pair}/answer`))).val();
       if(latest?.sdp&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription({type:latest.type,sdp:latest.sdp}))}
     }else{
       const offer=sig.offer||(await get(ref(db,`rooms/${roomCode}/public/voiceSignals/${pair}/offer`))).val();
       if(offer?.sdp&&!pc.currentRemoteDescription){
         await pc.setRemoteDescription(new RTCSessionDescription({type:offer.type,sdp:offer.sdp}));
         const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await waitIceComplete(pc);
         await set(ref(db,`rooms/${roomCode}/public/voiceSignals/${pair}/answer`),{type:pc.localDescription.type,sdp:pc.localDescription.sdp,from:uid,ts:Date.now()});
       }
     }
   }
 }catch(e){console.warn("voice sync",e)}finally{voiceSyncBusy=false;updateVoiceUi()}
}
async function sendChat(forced){const inp=document.getElementById("chatInput"),text=(forced||(inp?.value||"")).trim().slice(0,120);if(!text)return;try{await set(push(ref(db,`rooms/${roomCode}/chat`)),{uid,name:myName,text,ts:Date.now()});if(inp)inp.value=""}catch(e){toast("تعذر إرسال الرسالة")}}
async function sendSystem(text){try{await set(push(ref(db,`rooms/${roomCode}/chat`)),{uid:"system",name:"النظام",text,ts:Date.now()})}catch{}}
function renderChat(){const box=document.getElementById("chatBox");if(!box)return;const arr=Object.values(latestChat).sort((a,b)=>(a.ts||0)-(b.ts||0));box.innerHTML=arr.map(m=>`<p><b>${esc(m.name)}:</b> ${esc(m.text)}</p>`).join("");box.scrollTop=box.scrollHeight}

onAuthStateChanged(auth,u=>{if(u){uid=u.uid;if(roomCode)subscribe(roomCode);else home()}});ensureAuth().catch(e=>home("فشل تسجيل الدخول: "+(e.code||e.message)));
</script>
