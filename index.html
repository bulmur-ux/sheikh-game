<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>الشيخ | لعبة المجلس أونلاين</title>
<style>
:root{--bg:#f3ead8;--card:#fffaf0;--ink:#281d17;--muted:#817268;--maroon:#6d2633;--gold:#d0a13b;--line:#dfcfb3;--green:#2f6558;--danger:#a33d36}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f5ecd9,#eee1c7);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh}
.wrap{width:min(100%,560px);margin:auto;padding:0 14px 30px}.stripe{height:10px;background:repeating-linear-gradient(135deg,var(--maroon) 0 8px,var(--gold) 8px 16px);border-radius:0 0 10px 10px}
header{text-align:center;padding:22px 0 10px}header h1{margin:0;color:var(--maroon);font-size:34px}header p{margin:5px 0;color:var(--muted)}
.panel{background:rgba(255,250,240,.95);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 3px 12px rgba(40,29,23,.06)}
label{font-weight:800;font-size:14px;display:block;margin:0 0 7px}
input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-size:16px;text-align:right;outline:none}
input:focus{border-color:var(--gold)}
button{border:0;border-radius:13px;padding:13px 14px;font:inherit;font-weight:800;cursor:pointer}
.btn{width:100%;background:var(--gold);color:#201912}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.danger{background:var(--danger);color:#fff}.btn.green{background:var(--green);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.gap{height:8px}.err{color:var(--danger);font-size:13px;margin-top:8px}.ok{color:var(--green);font-size:13px;margin-top:8px}
.code{font-size:32px;letter-spacing:6px;font-weight:900;text-align:center;padding:14px;border:2px dashed var(--gold);border-radius:14px;background:#fff;margin:10px 0}
.players{list-style:none;padding:0;margin:10px 0}.players li{padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:7px 0}
.small{font-size:12px;color:var(--muted);line-height:1.7}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;background:#ead7a7;font-size:11px;margin-inline-start:6px}
.chat{height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}.chat p{margin:0 0 8px;font-size:14px}.chat b{color:var(--maroon)}
.quick{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.quick button{white-space:nowrap;background:#efe2c8;padding:9px 11px}
.hidden{display:none}.status{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="stripe"></div>
  <header><h1>الشيخ</h1><p>الشيك • السكور • لعبة المجلس أونلاين</p></header>
  <main id="app"><div class="panel">جاري الاتصال بـ Firebase...</div></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, set, update, onValue, push, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDIvMvlYDRINh8QHDiQMJfb1gv_mOsAsC8",
  authDomain: "al-sheikh-game.firebaseapp.com",
  databaseURL: "https://al-sheikh-game-default-rtdb.firebaseio.com",
  projectId: "al-sheikh-game",
  storageBucket: "al-sheikh-game.firebasestorage.app",
  messagingSenderId: "739452149085",
  appId: "1:739452149085:web:778619aa18fed1c698dcb4"
};

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getDatabase(fb);
const app = document.getElementById("app");

let uid=null, roomCode=localStorage.getItem("sheikh_room")||"", myName=localStorage.getItem("sheikh_name")||"";
let unsubRoom=null, unsubChat=null, currentRoom=null;

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function randomCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
async function ensureAuth(){
  if(auth.currentUser){uid=auth.currentUser.uid;return}
  await signInAnonymously(auth);
}
function home(msg=""){
  if(unsubRoom){unsubRoom();unsubRoom=null} if(unsubChat){unsubChat();unsubChat=null}
  app.innerHTML=`
  <div class="panel">
    <label>اسم اللاعب</label>
    <input id="name" maxlength="20" value="${esc(myName)}" placeholder="مثال: أحمد">
    <div class="gap"></div>
    <button id="create" class="btn">إنشاء غرفة</button>
    <div id="err" class="err">${esc(msg)}</div>
  </div>
  <div class="panel">
    <label>دخول غرفة موجودة</label>
    <input id="code" maxlength="5" value="${esc(roomCode)}" placeholder="كود الغرفة">
    <div class="gap"></div>
    <button id="join" class="btn alt">دخول</button>
  </div>
  <div class="panel small">
    تم تفعيل تسجيل الدخول المجهول تلقائياً. كل جهاز يحصل على هوية مستقلة في Firebase.
  </div>`;
  document.getElementById("create").onclick=createRoom;
  document.getElementById("join").onclick=joinRoom;
}
async function createRoom(){
  const n=document.getElementById("name").value.trim();
  if(!n){document.getElementById("err").textContent="اكتب اسم اللاعب أولاً";return}
  try{
    await ensureAuth(); uid=auth.currentUser.uid;
    let c=randomCode();
    for(let i=0;i<4;i++){const s=await get(ref(db,`rooms/${c}/public`)); if(!s.exists())break; c=randomCode()}
    const data={hostId:uid,status:"lobby",createdAt:Date.now(),players:{[uid]:{name:n,order:0,cardCount:0}}};
    await set(ref(db,`rooms/${c}/public`),data);
    myName=n;roomCode=c;
    localStorage.setItem("sheikh_name",n);localStorage.setItem("sheikh_room",c);
    subscribe(c);
  }catch(e){
    console.error(e);
    document.getElementById("err").textContent="تعذر إنشاء الغرفة: "+(e?.code||e?.message||"خطأ غير معروف");
  }
}
async function joinRoom(){
  const n=document.getElementById("name").value.trim();
  const c=document.getElementById("code").value.trim().toUpperCase();
  if(!n||!c){document.getElementById("err").textContent="اكتب الاسم وكود الغرفة";return}
  try{
    await ensureAuth(); uid=auth.currentUser.uid;
    const snap=await get(ref(db,`rooms/${c}/public`));
    if(!snap.exists()) throw new Error("الغرفة غير موجودة");
    const room=snap.val();
    const players=room.players||{};
    if(room.status!=="lobby" && !players[uid]) throw new Error("اللعبة بدأت");
    const order=players[uid]?.order ?? Object.keys(players).length;
    await update(ref(db,`rooms/${c}/public/players/${uid}`),{name:n,order,cardCount:players[uid]?.cardCount||0});
    myName=n;roomCode=c;
    localStorage.setItem("sheikh_name",n);localStorage.setItem("sheikh_room",c);
    subscribe(c);
  }catch(e){
    console.error(e);
    document.getElementById("err").textContent=e?.message||"تعذر دخول الغرفة";
  }
}
function subscribe(c){
  if(unsubRoom)unsubRoom();
  unsubRoom=onValue(ref(db,`rooms/${c}/public`),s=>{
    if(!s.exists()){home("الغرفة غير موجودة أو تم حذفها");return}
    currentRoom=s.val(); renderLobby();
  },e=>home("فشل قراءة الغرفة: "+(e.code||e.message)));
  if(unsubChat)unsubChat();
  unsubChat=onValue(query(ref(db,`rooms/${c}/chat`),limitToLast(50)),s=>renderChat(s.val()||{}));
}
function renderLobby(){
  const r=currentRoom||{}, ps=Object.entries(r.players||{}).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  app.innerHTML=`
  <div class="panel">
    <div class="small" style="text-align:center">كود الغرفة</div>
    <div class="code">${esc(roomCode)}</div>
    <ul class="players">${ps.map(([id,p])=>`<li>${esc(p.name)}${id===uid?' <span class="badge">أنت</span>':''}${id===r.hostId?' 👑':''}</li>`).join("")}</ul>
    <div class="row">
      <button id="copy" class="btn alt">نسخ الكود</button>
      <button id="leave" class="btn danger">خروج</button>
    </div>
    <div class="status">${ps.length} لاعب</div>
  </div>
  <div class="panel">
    <b>شات الغرفة</b>
    <div id="chatBox" class="chat"></div>
    <div class="quick">
      ${["جاهز","دورك","اكبس","شيك","ابدأ"].map(x=>`<button data-q="${x}">${x}</button>`).join("")}
    </div>
    <div class="row">
      <input id="chatInput" maxlength="120" placeholder="اكتب رسالة...">
      <button id="send" class="btn" style="flex:0 0 90px">إرسال</button>
    </div>
  </div>
  <div class="panel small">
    الاتصال والغرف والشات يعملون على Firebase. مرحلة اللعب الكاملة نركبها بعد ما نتأكد أن دخول لاعبين من جهازين مختلفين شغال بدون مشاكل.
  </div>`;
  document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(roomCode);alert("تم نسخ الكود")}catch{prompt("انسخ الكود",roomCode)}};
  document.getElementById("leave").onclick=()=>{localStorage.removeItem("sheikh_room");roomCode="";home()};
  document.getElementById("send").onclick=()=>sendChat();
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>sendChat(b.dataset.q));
}
async function sendChat(forced){
  const inp=document.getElementById("chatInput");
  const text=(forced||(inp?.value||"")).trim().slice(0,120); if(!text)return;
  try{
    await set(push(ref(db,`rooms/${roomCode}/chat`)),{uid,name:myName,text,ts:Date.now()});
    if(inp)inp.value="";
  }catch(e){alert("تعذر إرسال الرسالة: "+(e.code||e.message))}
}
function renderChat(obj){
  const box=document.getElementById("chatBox"); if(!box)return;
  const arr=Object.values(obj).sort((a,b)=>(a.ts||0)-(b.ts||0));
  box.innerHTML=arr.map(m=>`<p><b>${esc(m.name)}:</b> ${esc(m.text)}</p>`).join("");
  box.scrollTop=box.scrollHeight;
}

onAuthStateChanged(auth,u=>{
  if(u){uid=u.uid; if(roomCode)subscribe(roomCode); else home()}
});
ensureAuth().catch(e=>home("فشل تسجيل الدخول المجهول: "+(e.code||e.message)));
</script>
</body>
</html>
