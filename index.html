<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-title" content="شيك شيك">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=4">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=4">
<link rel="shortcut icon" href="icon-192.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=4">
<title>شيك شيك | لعبة المجلس أونلاين</title>
<meta name="theme-color" content="#6d2633">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --bg: #f3ead8;
  --card: #fffaf0;
  --ink: #281d17;
  --muted: #817268;
  --maroon: #6d2633;
  --gold: #d0a13b;
  --line: #dfcfb3;
  --green: #2f6558;
  --danger: #a33d36;
  --blue: #1f6fb2;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: linear-gradient(#f5ecd9, #eee1c7);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
  color: var(--ink);
  min-height: 100vh;
}
.wrap {
  width: min(100%, 600px);
  margin: auto;
  padding: 0 14px 34px;
}
.stripe {
  height: 10px;
  background: repeating-linear-gradient(135deg, var(--maroon) 0 8px, var(--gold) 8px 16px);
  border-radius: 0 0 10px 10px;
}
header {
  text-align: center;
  padding: 22px 0 10px;
}
header h1 {
  margin: 0;
  color: var(--maroon);
  font-size: 34px;
}
header p {
  margin: 5px 0;
  color: var(--muted);
}
.panel {
  background: rgba(255, 250, 240, .96);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 17px;
  margin: 14px 0;
  box-shadow: 0 3px 12px rgba(40, 29, 23, .06);
}
label {
  font-weight: 800;
  font-size: 14px;
  display: block;
  margin: 0 0 7px;
}
input, select {
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--line);
  border-radius: 13px;
  background: #fff;
  font-size: 16px;
  text-align: right;
  outline: none;
}
input:focus, select:focus {
  border-color: var(--gold);
}
button {
  border: 0;
  border-radius: 13px;
  padding: 13px 14px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.btn {
  width: 100%;
  background: var(--gold);
  color: #201912;
}
.btn.alt {
  background: #fff;
  border: 1px solid var(--line);
}
.btn.danger {
  background: var(--danger);
  color: #fff;
}
.btn.green {
  background: var(--green);
  color: #fff;
}
.btn.blue {
  background: var(--blue);
  color: #fff;
}
.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.row {
  display: flex;
  gap: 8px;
}
.row > * {
  flex: 1;
}
.gap {
  height: 8px;
}
.err {
  color: var(--danger);
  font-size: 13px;
  margin-top: 8px;
}
.ok {
  color: var(--green);
  font-size: 13px;
  margin-top: 8px;
}
.center {
  text-align: center;
}
.code {
  font-size: 32px;
  letter-spacing: 6px;
  font-weight: 900;
  text-align: center;
  padding: 14px;
  border: 2px dashed var(--gold);
  border-radius: 14px;
  background: #fff;
  margin: 10px 0;
}
.players {
  list-style: none;
  padding: 0;
  margin: 10px 0;
}
.players li {
  padding: 11px 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  margin: 7px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.small {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.7;
}
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 20px;
  background: #ead7a7;
  font-size: 11px;
  margin-inline-start: 6px;
}
.turnBadge {
  background: #d9efe6;
  color: #1f5b4b;
}
.chat {
  height: 220px;
  overflow: auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  margin: 10px 0;
}
.chat p {
  margin: 0 0 8px;
  font-size: 14px;
}
.chat b {
  color: var(--maroon);
}
.quick {
  display: flex;
  gap: 6px;
  overflow: auto;
  margin-bottom: 8px;
}
.quick button {
  white-space: nowrap;
  background: #efe2c8;
  padding: 9px 11px;
}
.hidden {
  display: none;
}
.status {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-top: 6px;
}
.gameTop {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pile {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  min-height: 138px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
.pileTitle {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 7px;
}
.cardFace, .cardBack {
  width: 78px;
  height: 110px;
  border-radius: 12px;
  border: 2px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: 900;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .08);
  background: #fff;
  position: relative;
}
.cardBack {
  background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUcAAAIcCAIAAADqivuVAAEAAElEQVR42oT9d5wlZZU/jp9znqeqbuww09OTM8MkMkMoAgISVEDFxLK5ZKVSlR1ddU1rLrmVTFhwICigIDkzDAwMEzOqaenc9++uaqe55zfH0/VvbdKP7/VVOBubXgQoXFwXp+0qN4QAAAAASUVORK5CYII=");
  background-size: cover;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>شيك شيك</h1>
    <p>لعبة المجلس أونلاين</p>
  </header>
  <div class="stripe"></div>

  <!-- قسم إدخال الاسم وإنشاء/انضمام للعبة -->
  <div id="lobbySection" class="panel">
    <div class="gap"></div>
    <label for="playerName">اسم اللاعب</label>
    <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." maxlength="15">
    <div class="gap"></div>
    <div class="row">
      <button class="btn" id="createRoomBtn">إنشاء جلسة</button>
      <button class="btn alt" id="showJoinBtn">انضمام لجلسة</button>
    </div>
    <div id="joinArea" class="hidden" style="margin-top: 12px;">
      <label for="roomCodeInput">رمز الجلسة</label>
      <input type="text" id="roomCodeInput" placeholder="مثال: 1234" maxlength="6" style="text-align: center; letter-spacing: 4px;">
      <div class="gap"></div>
      <button class="btn green" id="joinRoomBtn">دخول المجلس</button>
    </div>
    <div id="lobbyError" class="err"></div>
  </div>

  <!-- قسم غرفة الانتظار -->
  <div id="roomSection" class="panel hidden">
    <h2>رمز الجلسة</h2>
    <div class="code" id="displayRoomCode">----</div>
    <label>اللاعبون المتواجدون في المجلس:</label>
    <ul class="players" id="playersList"></ul>
    <div id="hostControls" class="hidden">
      <button class="btn green" id="startGameBtn">ابدأ اللعبة</button>
      <div class="gap"></div>
    </div>
    <button class="btn danger" id="leaveRoomBtn">مغادرة الجلسة</button>
    <div id="roomStatus" class="status">بانتظار انضمام باقي اللاعبين...</div>
  </div>

  <!-- قسم واجهة اللعب -->
  <div id="gameSection" class="panel hidden">
    <div class="gameTop">
      <div class="pile">
        <div class="pileTitle">كومة السحب</div>
        <div class="cardBack" id="drawPileBtn" title="اسحب ورقة"></div>
        <div class="small" id="drawCount" style="margin-top:6px;">0 ورقة</div>
      </div>
      <div class="pile">
        <div class="pileTitle">الورقة الحالية</div>
        <div class="cardFace" id="currentCard">-</div>
      </div>
    </div>
    
    <div class="gap"></div>
    <div class="panel" style="background:#fff; margin:0;">
      <div class="pileTitle">أوراقك في اليد</div>
      <div id="myHand" style="display:flex; gap:8px; overflow:auto; padding:6px 0; min-height:125px;"></div>
    </div>

    <div class="gap"></div>
    <div class="row">
      <button class="btn blue" id="callSheekBtn">شيك شيك!</button>
      <button class="btn alt" id="passTurnBtn">تخطي الدور</button>
    </div>

    <div class="gap"></div>
    <label>دردشة المجلس</label>
    <div class="quick">
      <button type="button" onclick="sendQuickChat('يا هلا بالربع')">يا هلا بالربع</button>
      <button type="button" onclick="sendQuickChat('عطني الورقة')">عطني الورقة</button>
      <button type="button" onclick="sendQuickChat('شيك شيك!')">شيك شيك!</button>
      <button type="button" onclick="sendQuickChat('حظ هقوة')">حظ هقوة</button>
    </div>
    <div class="chat" id="chatBox"></div>
    <div class="row">
      <input type="text" id="chatInput" placeholder="اكتب رسالتك..." maxlength="100">
      <button class="btn" id="sendChatBtn" style="width: 90px;">إرسال</button>
    </div>
  </div>

</div>

<script>
  const el = id => document.getElementById(id);
  
  el('showJoinBtn').addEventListener('click', () => {
    el('joinArea').classList.toggle('hidden');
  });

  el('createRoomBtn').addEventListener('click', () => {
    const name = el('playerName').value.trim();
    if (!name) {
      el('lobbyError').textContent = 'الرجاء إدخال اسم اللاعب أولاً.';
      return;
    }
    el('lobbyError').textContent = '';
    el('lobbySection').classList.add('hidden');
    el('roomSection').classList.remove('hidden');
    el('displayRoomCode').textContent = '8821';
    el('hostControls').classList.remove('hidden');
    el('playersList').innerHTML = `<li><span>${name} (أنت - المضيف)</span> <span class="badge">جاهز</span></li>`;
  });

  el('startGameBtn').addEventListener('click', () => {
    el('roomSection').classList.add('hidden');
    el('gameSection').classList.remove('hidden');
    
    let handHtml = '';
    ['٧ ♥', 'Q ♣', 'A ♦', '10 ♠'].forEach(c => {
      handHtml += `<div class="cardFace" style="cursor:pointer; font-size:22px;">${c}</div>`;
    });
    el('myHand').innerHTML = handHtml;
    el('currentCard').textContent = 'K ♠';
  });

  window.sendQuickChat = function(msg) {
    const chatBox = el('chatBox');
    chatBox.innerHTML += `<p><b>أنت:</b> ${msg}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  };

  el('sendChatBtn').addEventListener('click', () => {
    const txt = el('chatInput').value.trim();
    if (txt) {
      sendQuickChat(txt);
      el('chatInput').value = '';
    }
  });
</script>
</body>
</html>
