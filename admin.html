<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#120b08" />
<title>لوحة تحكم شيك شيك</title>
<style>
:root{--bg:#0d0907;--panel:#17100d;--panel2:#211611;--gold:#e8b84a;--gold2:#ffdc82;--red:#9e1732;--green:#1f9d63;--text:#fff8e8;--muted:#c7b89a;--line:#6f5224}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#3c2417 0,#17100d 34%,#0d0907 72%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:100%;background:linear-gradient(180deg,rgba(39,25,17,.97),rgba(19,13,10,.98));border:1px solid #7a5725;border-radius:24px;box-shadow:0 18px 60px #0008,inset 0 0 0 1px #f2c35b22;padding:22px}.brand{text-align:center;margin-bottom:22px}.crown{font-size:38px;filter:drop-shadow(0 4px 8px #000)}h1{margin:4px 0 7px;color:var(--gold2);font-size:28px}.sub{color:var(--muted);font-size:14px;line-height:1.7}.field{margin:14px 0}.field label{display:block;color:#efdcae;font-size:13px;margin:0 4px 7px}.field input{width:100%;height:50px;border-radius:14px;border:1px solid #765426;background:#0d0a08;color:white;font-size:16px;padding:0 14px;outline:none;direction:ltr;text-align:left}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e8b84a22}.btn{width:100%;height:52px;border:0;border-radius:15px;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#f3c85f,#c88b21);color:#211407;box-shadow:0 8px 20px #0006;margin-top:8px}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.6}.msg.err{display:block;background:#7d142655;border:1px solid #c83a55;color:#ffd7df}.msg.ok{display:block;background:#176b4655;border:1px solid #2ba871;color:#d9ffed}.dash{display:none}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{background:#2b1b10;border:1px solid #8e682d;border-radius:999px;padding:8px 11px;color:#ffd976;font-weight:700;font-size:12px}.stat{margin-top:18px;background:#0e0a08;border:1px solid #5d431f;border-radius:16px;padding:16px}.stat strong{display:block;color:#7cffb5;font-size:18px;margin-top:5px}.logout{margin-top:18px;background:#4e101d;color:#fff;border:1px solid #9e2e46}.small{font-size:12px;color:#a8997e;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap"><section class="card">
  <div id="loginView">
    <div class="brand"><div class="crown">👑</div><h1>لوحة تحكم شيك شيك</h1><div class="sub">دخول خاص بالإدارة العامة للعبة</div></div>
    <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div>
    <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="loginBtn" class="btn">دخول الأدمن</button>
    <div id="loginMsg" class="msg"></div>
    <div class="small">لا ترسل كلمة المرور لأي شخص.</div>
  </div>

  <div id="dashView" class="dash">
    <div class="top"><div><div style="color:#bda77f;font-size:12px">الحساب الحالي</div><div id="adminEmail" style="font-weight:800;margin-top:3px;direction:ltr;text-align:right"></div></div><span class="badge">SUPER ADMIN 👑</span></div>
    <div class="stat"><div style="color:#c8b795">حالة الصلاحية</div><strong>تم التحقق من Super Admin ✅</strong><div class="sub" style="margin-top:7px">هذه أول مرحلة فقط. بعدها نضيف الغرف واللاعبين والحظر والـ Reset.</div></div>
    <button id="logoutBtn" class="btn logout">تسجيل الخروج</button>
  </div>
</section></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyDIvMvlYDRINh8QHDiQMJfb1gv_mOsAsC8",authDomain:"al-sheikh-game.firebaseapp.com",databaseURL:"https://al-sheikh-game-default-rtdb.firebaseio.com",projectId:"al-sheikh-game",storageBucket:"al-sheikh-game.firebasestorage.app",messagingSenderId:"739452149085",appId:"1:739452149085:web:778619aa18fed1c698dcb4"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getDatabase(fb);
const loginView=document.getElementById('loginView'),dashView=document.getElementById('dashView'),loginBtn=document.getElementById('loginBtn'),loginMsg=document.getElementById('loginMsg'),emailEl=document.getElementById('email'),passEl=document.getElementById('password');
function msg(text,type='err'){loginMsg.className='msg '+type;loginMsg.textContent=text}
function showLogin(){loginView.style.display='block';dashView.style.display='none'}
function showDash(user){loginView.style.display='none';dashView.style.display='block';document.getElementById('adminEmail').textContent=user.email||user.uid}
async function verifyAdmin(user){
  const snap=await get(ref(db,`admins/${user.uid}/superAdmin`));
  return snap.exists() && snap.val()===true;
}
loginBtn.onclick=async()=>{
  const email=emailEl.value.trim(),password=passEl.value;
  if(!email||!password){msg('اكتب البريد وكلمة المرور أولاً.');return}
  loginBtn.disabled=true;loginBtn.textContent='جاري التحقق...';loginMsg.className='msg';
  try{
    const cred=await signInWithEmailAndPassword(auth,email,password);
    if(!(await verifyAdmin(cred.user))){await signOut(auth);throw new Error('NO_ADMIN')}
    showDash(cred.user);
  }catch(e){
    msg(e.message==='NO_ADMIN'?'هذا الحساب ليس لديه صلاحية Super Admin.':'تعذر تسجيل الدخول. تأكد من البريد وكلمة المرور.');
  }finally{loginBtn.disabled=false;loginBtn.textContent='دخول الأدمن'}
};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
  if(!user){showLogin();return}
  try{if(await verifyAdmin(user)) showDash(user); else {await signOut(auth);showLogin();}}catch{showLogin()}
});
</script>
</body></html>
