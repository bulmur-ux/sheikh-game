<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#120b08"/>
<title>لوحة تحكم شيك شيك</title>
<style>
:root{
  --bg:#0d0907;--panel:#17100d;--panel2:#211611;--gold:#e8b84a;--gold2:#ffdc82;
  --red:#9e1732;--red2:#d33152;--green:#1f9d63;--blue:#2476d8;--text:#fff8e8;
  --muted:#c7b89a;--line:#6f5224;--shadow:#0008;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% -10%,#3c2417 0,#17100d 34%,#0d0907 72%);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button,input{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:14px 0 40px}
.card{background:linear-gradient(180deg,rgba(39,25,17,.97),rgba(19,13,10,.98));
border:1px solid #7a5725;border-radius:24px;box-shadow:0 18px 60px var(--shadow),inset 0 0 0 1px #f2c35b22;padding:18px}
.brand{text-align:center;margin-bottom:20px}.crown{font-size:38px}h1{margin:4px 0 7px;color:var(--gold2);font-size:27px}
.sub{color:var(--muted);font-size:13px;line-height:1.7}
.field{margin:13px 0}.field label{display:block;color:#efdcae;font-size:13px;margin:0 4px 7px}
.field input{width:100%;height:50px;border-radius:14px;border:1px solid #765426;background:#0d0a08;color:white;font-size:16px;padding:0 14px;outline:none;direction:ltr;text-align:left}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e8b84a22}
.btn{border:0;border-radius:14px;font-weight:800;cursor:pointer;min-height:46px;padding:0 15px}
.btn:disabled{opacity:.5}
.btnGold{width:100%;background:linear-gradient(180deg,#f3c85f,#c88b21);color:#211407}
.btnRed{background:linear-gradient(180deg,#b51f3f,#761225);color:#fff}
.btnBlue{background:linear-gradient(180deg,#2f87ef,#1851a4);color:#fff}
.btnDark{background:#211611;color:#ffe29a;border:1px solid #6a4c25}
.msg{display:none;margin-top:13px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.6}
.msg.err{display:block;background:#7d142655;border:1px solid #c83a55;color:#ffd7df}
.msg.ok{display:block;background:#176b4655;border:1px solid #2ba871;color:#d9ffed}
#dashView{display:none}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.adminMeta{min-width:0}.adminEmail{font-weight:800;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.badge{background:#2b1b10;border:1px solid #8e682d;border-radius:999px;padding:8px 11px;color:#ffd976;font-weight:800;font-size:12px;white-space:nowrap}
.gridStats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.stat{background:#0e0a08;border:1px solid #5d431f;border-radius:16px;padding:13px;text-align:center}
.stat b{display:block;font-size:23px;color:#ffdf7f;margin-bottom:4px}.stat span{font-size:11px;color:#c8b795}
.section{margin-top:14px;background:#100b08;border:1px solid #5d431f;border-radius:18px;padding:13px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sectionTitle h2{margin:0;font-size:17px;color:#ffe39c}.refresh{min-height:36px;padding:0 12px}
.empty{padding:22px 8px;text-align:center;color:#a99673}
.room{border:1px solid #5c4020;background:linear-gradient(180deg,#1d130f,#120c09);border-radius:16px;margin:10px 0;overflow:hidden}
.roomHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px}
.roomInfo{min-width:0}.roomCode{font-size:18px;font-weight:900;color:#ffe29a;direction:ltr;text-align:right}.roomMeta{font-size:12px;color:#bda98a;margin-top:4px}
.roomActions{display:flex;gap:7px;flex-wrap:wrap}.roomActions .btn{min-height:37px;font-size:12px}
.players{display:none;border-top:1px solid #4e371b;padding:8px 10px 12px;background:#0c0907}
.players.open{display:block}
.player{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 5px;border-bottom:1px solid #342514}
.player:last-child{border-bottom:0}.pname{font-weight:800}.prole{font-size:11px;color:#b7a487;margin-top:2px}.kick{min-height:34px;font-size:11px;padding:0 10px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.logout{background:#4e101d;color:#fff;border:1px solid #9e2e46}
.note{margin-top:10px;color:#a99673;font-size:11px;line-height:1.6}
@media(max-width:520px){
 .wrap{padding-top:8px}.card{padding:14px;border-radius:20px}.gridStats{grid-template-columns:repeat(3,1fr)}
 .stat{padding:11px 5px}.stat b{font-size:20px}.adminEmail{max-width:190px}.roomHead{align-items:flex-start;flex-direction:column}
 .roomActions{width:100%}.roomActions .btn{flex:1}.toolbar{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<section class="card">
  <div id="loginView">
    <div class="brand"><div class="crown">👑</div><h1>لوحة تحكم شيك شيك</h1><div class="sub">دخول خاص بالإدارة العامة للعبة</div></div>
    <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div>
    <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="loginBtn" class="btn btnGold">دخول الأدمن</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="dashView">
    <div class="header">
      <div class="adminMeta">
        <div style="color:#bda77f;font-size:11px">الحساب الحالي</div>
        <div id="adminEmail" class="adminEmail"></div>
      </div>
      <span class="badge">SUPER ADMIN 👑</span>
    </div>

    <div class="gridStats">
      <div class="stat"><b id="roomsCount">0</b><span>الغرف</span></div>
      <div class="stat"><b id="playersCount">0</b><span>اللاعبون</span></div>
      <div class="stat"><b id="gamesCount">0</b><span>مباريات جارية</span></div>
    </div>

    <div class="section">
      <div class="sectionTitle">
        <h2>إدارة الغرف</h2>
        <button id="refreshBtn" class="btn btnDark refresh">تحديث ↻</button>
      </div>
      <div id="roomsList"><div class="empty">جاري تحميل الغرف...</div></div>
    </div>

    <div class="toolbar">
      <button id="closeAllBtn" class="btn btnRed">إغلاق جميع الغرف</button>
      <button id="logoutBtn" class="btn logout">تسجيل الخروج</button>
    </div>
    <div class="note">الحذف والطرد يحتاجان تأكيدًا. لا يتم عرض أوراق اللاعبين الخاصة داخل لوحة الإدارة.</div>
  </div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyDIvMvlYDRINh8QHDiQMJfb1gv_mOsAsC8",authDomain:"al-sheikh-game.firebaseapp.com",databaseURL:"https://al-sheikh-game-default-rtdb.firebaseio.com",projectId:"al-sheikh-game",storageBucket:"al-sheikh-game.firebasestorage.app",messagingSenderId:"739452149085",appId:"1:739452149085:web:778619aa18fed1c698dcb4"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getDatabase(fb);

const $=id=>document.getElementById(id);
const loginView=$('loginView'),dashView=$('dashView'),loginBtn=$('loginBtn'),loginMsg=$('loginMsg');
let stopRooms=null,currentRooms={};

function msg(text,type='err'){loginMsg.className='msg '+type;loginMsg.textContent=text}
function showLogin(){loginView.style.display='block';dashView.style.display='none'; if(stopRooms){stopRooms();stopRooms=null}}
function showDash(user){loginView.style.display='none';dashView.style.display='block';$('adminEmail').textContent=user.email||user.uid;subscribeRooms()}
async function verifyAdmin(user){
  const snap=await get(ref(db,`admins/${user.uid}/superAdmin`));
  return snap.exists() && snap.val()===true;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]))}
function roomStatus(pub){
  const s=pub?.status||pub?.game?.phase||'lobby';
  if(s==='playing'||s==='game') return '🎮 جارية';
  if(s==='lobby') return '⏳ انتظار';
  return esc(s);
}
function getPlayers(room){
  const p=room?.public?.players||{};
  return Object.entries(p).map(([uid,v])=>({uid,...(v||{})}));
}
function renderRooms(){
  const list=$('roomsList');
  const entries=Object.entries(currentRooms||{});
  let totalPlayers=0,games=0;
  for(const [,room] of entries){
    totalPlayers+=getPlayers(room).length;
    const s=room?.public?.status||room?.public?.game?.phase;
    if(s==='game'||s==='playing'||s==='memorize'||s==='dealing') games++;
  }
  $('roomsCount').textContent=entries.length;
  $('playersCount').textContent=totalPlayers;
  $('gamesCount').textContent=games;

  if(!entries.length){list.innerHTML='<div class="empty">لا توجد غرف مفتوحة حاليًا ✅</div>';return}
  list.innerHTML=entries.map(([code,room])=>{
    const pub=room?.public||{},players=getPlayers(room);
    const phtml=players.length?players.map(p=>`
      <div class="player">
        <div><div class="pname">${esc(p.name||'بدون اسم')}</div><div class="prole">${esc(p.role||'player')} • ${p.ready?'جاهز':'غير جاهز'}</div></div>
        <button class="btn btnRed kick" data-kick="${esc(code)}" data-uid="${esc(p.uid)}" data-name="${esc(p.name||'اللاعب')}">إخراج</button>
      </div>`).join(''):'<div class="empty" style="padding:12px">لا يوجد لاعبون</div>';
    return `
      <div class="room">
        <div class="roomHead">
          <div class="roomInfo">
            <div class="roomCode">#${esc(code)}</div>
            <div class="roomMeta">${roomStatus(pub)} • ${players.length} لاعب</div>
          </div>
          <div class="roomActions">
            <button class="btn btnBlue" data-toggle="${esc(code)}">اللاعبون</button>
            <button class="btn btnRed" data-close="${esc(code)}">إغلاق الغرفة</button>
          </div>
        </div>
        <div id="players-${esc(code)}" class="players">${phtml}</div>
      </div>`;
  }).join('');
}
function subscribeRooms(){
  if(stopRooms)stopRooms();
  stopRooms=onValue(ref(db,'rooms'),snap=>{currentRooms=snap.val()||{};renderRooms()},err=>{
    $('roomsList').innerHTML='<div class="empty">تعذر قراءة الغرف: '+esc(err.message)+'</div>';
  });
}
$('roomsList').addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t)return;
  if(t.dataset.toggle){
    const el=document.getElementById('players-'+t.dataset.toggle); if(el)el.classList.toggle('open'); return;
  }
  if(t.dataset.close){
    const code=t.dataset.close;
    if(!confirm(`إغلاق الغرفة ${code} وحذف جميع بياناتها؟`))return;
    t.disabled=true;
    try{await remove(ref(db,`rooms/${code}`));}
    catch(err){alert('تعذر إغلاق الغرفة: '+err.message)}
    finally{t.disabled=false}
    return;
  }
  if(t.dataset.kick){
    const {kick:code,uid,name}=t.dataset;
    if(!confirm(`إخراج ${name} من الغرفة ${code}؟`))return;
    t.disabled=true;
    try{
      const changes={};
      changes[`rooms/${code}/public/players/${uid}`]=null;
      changes[`rooms/${code}/privateHands/${uid}`]=null;
      await update(ref(db),changes);
    }catch(err){alert('تعذر إخراج اللاعب: '+err.message)}
    finally{t.disabled=false}
  }
});
$('refreshBtn').onclick=()=>subscribeRooms();
$('closeAllBtn').onclick=async()=>{
  const count=Object.keys(currentRooms||{}).length;
  if(!count){alert('لا توجد غرف مفتوحة.');return}
  if(!confirm(`إغلاق جميع الغرف (${count})؟ هذا الإجراء لا يمكن التراجع عنه.`))return;
  $('closeAllBtn').disabled=true;
  try{await remove(ref(db,'rooms'))}
  catch(err){alert('تعذر إغلاق جميع الغرف: '+err.message)}
  finally{$('closeAllBtn').disabled=false}
};
loginBtn.onclick=async()=>{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){msg('اكتب البريد وكلمة المرور أولاً.');return}
  loginBtn.disabled=true;loginBtn.textContent='جاري التحقق...';loginMsg.className='msg';
  try{
    const cred=await signInWithEmailAndPassword(auth,email,password);
    if(!(await verifyAdmin(cred.user))){await signOut(auth);throw new Error('NO_ADMIN')}
    showDash(cred.user);
  }catch(e){
    msg(e.message==='NO_ADMIN'?'هذا الحساب ليس لديه صلاحية Super Admin.':'تعذر تسجيل الدخول. تأكد من البريد وكلمة المرور.');
  }finally{loginBtn.disabled=false;loginBtn.textContent='دخول الأدمن'}
};
$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
  if(!user){showLogin();return}
  try{if(await verifyAdmin(user)) showDash(user); else {await signOut(auth);showLogin();}}catch{showLogin()}
});
</script>
</body>
</html>
